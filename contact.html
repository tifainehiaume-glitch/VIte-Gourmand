<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Vite & Gourmand</title>
</head>
<body>
    <header>
        <nav>
     <a href="/index.html" class="logo" >
        <img src="logo-vite-et-gourmand.svg" alt="Logo Vite & Gourmand" class="logo-image"> 
     </a>
     <ul class="navbar">
            <li><a href="/menus.html">Nos Menus</a></li>
            <li><a href="/contact.html">Nous Contacter</a></li>
            <li><a href="/connecter.html">Me Connecter</a></li>
     </ul>  
    </nav>
</header>    
<main>
    <section class="nous-contacter">
        <h1>Nous Contacter</h1>
    </section>
    <section class="contact-form">
        <form action="#" method="post">
            <div class="contact">
            <label for="object">Object:</label>
            <input type="text" id="object" name="object" required>
            </div>

            <div class="contact">
            <label for="name">Nom:</label>
            <input type="text" id="name" name="name" required>
            </div>

            <div class="contact">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            </div>

            <div class="contact">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <button type="submit">Envoyer</button>
        </form>
    </section>
</main>  
<footer>
    <div class="horaires">
        <p>Nos Horaires:</p>
        <p>Lundi - Dimanche: 9h - 18h</p>
    </div>
    <nav class="mentions">
        <p class="ml"><a href="#">Mentions Legales</a></p>
        <p class="cg"><a href="#">Conditions Generales</a></p>
    </nav>
</footer>
</body>
</html>
